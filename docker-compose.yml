services:
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/static
    expose:
      - "8000"

  nginx:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/static:ro
    depends_on:
      - backend

volumes:
  media_data:
  static_data: